[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccvet"
version = "0.0.1"
description = "A risk-classifying PreToolUse permission hook for Claude Code. Auto-approves safe commands, blocks dangerous ones, asks about the rest, with an optional local LLM for the gray zone."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = [
    "claude-code",
    "claude",
    "anthropic",
    "pretooluse",
    "permission-hook",
    "auto-approve",
    "risk-classifier",
    "security",
    "guardrails",
    "llm-agent-safety",
    "ollama",
    "lm-studio",
    "ai-agent-security",
]
dependencies = [
    "bashlex>=0.18",
    "pyyaml>=6.0",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/saicharansreedhara2/ccvet"
Repository = "https://github.com/saicharansreedhara2/ccvet"
Issues = "https://github.com/saicharansreedhara2/ccvet/issues"

[project.scripts]
ccvet = "ccvet.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/ccvet"]
