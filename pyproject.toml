[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccvet"
version = "0.0.1"
description = "A risk-classifying PreToolUse gate for Claude Code: auto-approve low-risk tool calls, block dangerous ones, ask about the rest."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/mortalapps/ccvet"

[project.scripts]
ccvet = "ccvet.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/ccvet"]
