# Simple program-level classification for ccvet's Bash rule engine.
#
# This file only covers programs whose risk doesn't depend on which flags or
# arguments are present. Anything argument-sensitive (rm -rf, chmod -R 777,
# git push --force, obfuscation/exfil patterns, secret and persistence file
# paths, SQL without WHERE) lives in ccvet's built-in guards in rules.py
# instead — those are the safety floor and are intentionally not
# user-overridable from a YAML file. User overrides (Phase 3) will layer on
# top of this file, not replace the built-in guards.

auto_programs:
  - ls
  - pwd
  - cat
  - less
  - more
  - head
  - tail
  - grep
  - rg
  - ag
  - file
  - stat
  - wc
  - diff
  - tree
  - du
  - df
  - which
  - type
  - uname
  - whoami
  - id
  - uptime
  - ps
  - top

# "env" is deliberately NOT here, even though risk-taxonomy.md always
# said it should ask, not auto - it was shipped in the auto list by
# mistake. `env` with no arguments dumps the *current session's own*
# environment, which for an agent session commonly includes real,
# actively-used API keys and tokens. "ps"/"top" stay auto as a
# conscious judgment call: they expose *other* processes' info (a real
# but different, lower-probability vector), and are common enough that
# asking about them constantly would reintroduce the prompt fatigue
# ccvet exists to reduce.

# npm/pip/pip3 are deliberately absent here — they have their own
# subcommand-aware classifier in rules.py (list/show/freeze are read-only,
# everything else asks, publish/upload is blocked).
ask_programs:
  - mkdir
  - touch
  - cp
  - mv
  - ln
  - chmod
  - npx
  - cargo
  - go
  - brew
  - make
  - docker
  - kill
  - killall
  - pkill
  - curl
  - wget
  - ping
  - dig
  - nslookup
  - aws
  - kubectl
  - terraform
  - gcloud
  - pytest
  - eslint
  - tsc
  - systemctl
  - launchctl
  - crontab

# Git subcommands with no argument-sensitivity (no destructive flags
# possible for these specific subcommands). "push", "reset", "clean",
# "branch", "stash", "remote", "tag", and "filter-branch" are all handled
# by dedicated logic in rules.py instead, since their risk depends
# entirely on their flags (e.g. "git remote remove origin" and
# "git tag -d" are mutating, but "git remote -v" and "git tag -l" aren't).
git:
  auto_subcommands: [status, diff, log, show, blame, fetch, describe]
  ask_subcommands: [add, commit, checkout, merge, pull, rebase]
