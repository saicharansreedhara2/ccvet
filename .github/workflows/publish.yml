name: Publish to PyPI

# Runs on a version tag (e.g. v0.0.1). Uses PyPI trusted publishing (OIDC),
# so no API token is stored anywhere in this repo. The trusted publisher
# has to be configured once on the PyPI project's own settings page before
# this will work. See Docs/PLAN.md Phase 6 for the setup steps.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
